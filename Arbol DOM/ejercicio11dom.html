<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIVs y Display</title>
    <style>
        .caja{
            width: 300px;
            height: 100px;
            margin: 10px;
        }
        #div1 {
            background-color: red;
        }
        #div2 {
            background-color: green;
            display: none;
        }
        #div3 {
            background-color: blue;
        }
    </style>
</head>
<body>
    <div id="div1" class="caja">I am the DIV 1</div>
    <div id="div2" class="caja">I am the DIV 2</div>
    <div id="div3" class="caja">I am the DIV 3</div>

    <script src="ejercicio11dom.js"></script>
</body>
</html>
