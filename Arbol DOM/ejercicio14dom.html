<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UWU</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .menu-item {
            background-color: #f1f1f1;
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            width: 200px;
            font-weight: bold;
            border: 1px solid #ccc;
        }
        .submenu {
            display: none;
            padding-left: 15px;
            margin-bottom: 5px;
        }
        .submenu div {
            padding: 5px;
            background-color: #fafafa;
            border-left: 1px solid #007BFF;
            margin: 2px 0;
            width: 185px;
        }
    </style>
</head>
<body>

    INICIO
    <div id="btnInicio" class="menu-item">Inicio</div>
    <div id="subInicio" class="submenu">
        <div>Portada</div>
        <div>Acerca de mi</div>
        <div>Mis fotos</div>
    </div>

    PROYECTOS
    <div id="btnProyectos" class="menu-item">Proyectos</div>
    <div id="subProyectos" class="submenu">
        <div>Web Apps</div>
        <div>Mobile Apps</div>
        <div>Juegos</div>
    </div>

    PORFOLIO
    <div id="btnPortfolio" class="menu-item">Portfolio</div>
    <div id="subPortfolio" class="submenu">
        <div>Paginas webs</div>
        <div>Software</div>
    </div>

    CONTACTO
    <div id="btnContacto" class="menu-item">Contacto</div>

    <script src="ejercicio14dom.js"></script>
</body>
</html>
